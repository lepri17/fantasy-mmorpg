name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  checks:
    # Fast checks without Godot: game data, project wiring, GDScript style.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install the Python tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet "gdtoolkit==4.*" pillow

      - name: Check game data
        run: .venv/bin/python tools/check_data.py

      - name: Check project wiring
        run: .venv/bin/python tools/check_project.py

      - name: Lint GDScript
        run: .venv/bin/gdlint client/

  server:
    # The game server (server/): lint, then its tests on SQLite and on PostgreSQL.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mmo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Install the server and its test tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r server/requirements-dev.txt

      - name: Lint the server
        run: .venv/bin/ruff check --config server/ruff.toml server/

      - name: Test the server (SQLite and PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mmo_test
        run: .venv/bin/python -m pytest -q server/tests

  build-apk:
    needs: checks
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v6

      - name: Set up Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import assets and run the smoke test in Godot
        shell: bash
        run: |
          cd client
          # Godot's exit code after --import is not reliable, so the log decides:
          # any ERROR line while importing fails the build.
          set +e
          godot --headless --import > ../import.log 2>&1
          echo "import exit code: $?"
          set -e
          cat ../import.log
          if grep -E "ERROR" ../import.log; then echo "Import failed"; exit 1; fi
          set -o pipefail
          timeout 180 godot --headless -s res://tests/smoke_test.gd 2>&1 | tee ../smoke.log
          if grep -E "SCRIPT ERROR|Parse Error" ../smoke.log; then exit 1; fi

      - name: Debug keystore
        # A fixed key from the DEBUG_KEYSTORE_BASE64 secret keeps the signature the
        # same between builds, so a new APK installs over the old one.
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Using the fixed debug key from the repository secret"
          else
            echo "::warning::No DEBUG_KEYSTORE_BASE64 secret: signing with a new key. Updates need a reinstall."
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi

      - name: Point Godot at the Java and Android SDKs
        run: |
          JAVA_PATH="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(which java)")")")}"
          ANDROID_PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "java: $JAVA_PATH"
          echo "android sdk: $ANDROID_PATH"
          ls "$ANDROID_PATH" "$ANDROID_PATH/build-tools" || true
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\n' "$JAVA_PATH" "$ANDROID_PATH" > ~/.config/godot/$f
          done

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          cd client
          godot --headless --verbose --export-debug "Android" ../build/fantasy-mmorpg-debug.apk
          ls -la ../build

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: fantasy-mmorpg-debug-apk
          path: build/fantasy-mmorpg-debug.apk

      - name: Move the "latest" tag to this commit
        # So "Source code" on the release page matches the APK.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      - name: Publish APK to the "latest" release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest APK
          body: |
            APK אוטומטי מהגרסה האחרונה ב-main.
            מתעדכן בכל build. גרסה: ${{ github.sha }}
          files: build/fantasy-mmorpg-debug.apk
